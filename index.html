                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                />
                <div className="grid grid-cols-2 gap-2">
                  <select
                    value={shelfForm.category}
                    onChange={(e) => setShelfForm({ ...shelfForm, category: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  >
                    {SHELF_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <input
                    type="text"
                    placeholder="Part Number"
                    value={shelfForm.partNumber}
                    onChange={(e) => setShelfForm({ ...shelfForm, partNumber: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono"
                  />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="number"
                    required
                    placeholder="Quantity"
                    value={shelfForm.quantity}
                    onChange={(e) => setShelfForm({ ...shelfForm, quantity: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono"
                  />
                  <input
                    type="text"
                    placeholder="Unit (quarts, bulbs, filters)"
                    value={shelfForm.unit}
                    onChange={(e) => setShelfForm({ ...shelfForm, unit: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setIsShelfModalOpen(false)} className="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300">Cancel</button>
                  <button type="submit" className="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950">Add to Shelf</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL 5: ADD CUSTOM GUIDE */}
          {isGuideModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 p-4 overflow-y-auto">
              <form
                onSubmit={handleSaveGuide}
                className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 space-y-3"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">Create Custom DIY Service Guide</h3>
                  <button type="button" onClick={() => setIsGuideModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <input
                  type="text"
                  required
                  placeholder="Service Title (e.g. Rear Shocks Replacement)"
                  value={guideForm.title}
                  onChange={(e) => setGuideForm({ ...guideForm, title: e.target.value })}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                />
                <div className="grid grid-cols-2 gap-2">
                  <select
                    value={guideForm.vehicleId}
                    onChange={(e) => setGuideForm({ ...guideForm, vehicleId: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  >
                    <option value="ALL">All Vehicles</option>
                    {vehicles.map((v) => <option key={v.id} value={v.id}>{v.year} {v.make} {v.model}</option>)}
                  </select>
                  <input
                    type="number"
                    placeholder="Interval Miles (e.g. 50000)"
                    value={guideForm.intervalMiles}
                    onChange={(e) => setGuideForm({ ...guideForm, intervalMiles: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono"
                  />
                </div>
                <input
                  type="text"
                  placeholder="Required Tools (comma-separated)"
                  value={guideForm.requiredToolsCsv}
                  onChange={(e) => setGuideForm({ ...guideForm, requiredToolsCsv: e.target.value })}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                />
                <textarea
                  rows="3"
                  placeholder="Torque specs, socket sizes & DIY advice..."
                  value={guideForm.specsAndAdvice}
                  onChange={(e) => setGuideForm({ ...guideForm, specsAndAdvice: e.target.value })}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                />
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setIsGuideModalOpen(false)} className="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300">Cancel</button>
                  <button type="submit" className="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950">Save Guide</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL 6: SUPABASE CLOUD SYNC */}
          {isPhoneModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">Supabase Cloud Sync & Phone Setup</h3>
                  <button onClick={() => setIsPhoneModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <p className="text-xs text-slate-400">
                  Your changes always save immediately to this device. To sync automatically between your computer and phone, paste your Supabase URL & Anon Key below.
                </p>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      copyTextToClipboard(SUPABASE_SETUP_SQL);
                      setShowSqlBox(true);
                      showToast('Copied SQL Setup Script!');
                    }}
                    className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700"
                  >
                    Copy SQL Setup Script
                  </button>
                  <button
                    type="button"
                    onClick={() => setShowSqlBox(!showSqlBox)}
                    className="text-xs text-slate-400 underline"
                  >
                    {showSqlBox ? 'Hide SQL' : 'Show SQL'}
                  </button>
                </div>
                {showSqlBox && (
                  <pre className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-[10px] text-emerald-300 overflow-x-auto font-mono">
                    {SUPABASE_SETUP_SQL}
                  </pre>
                )}
                <input
                  type="text"
                  placeholder="Supabase Project URL or Reference ID"
                  value={supabaseUrl}
                  onChange={(e) => setSupabaseUrl(normalizeSupabaseUrl(e.target.value))}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono"
                />
                <input
                  type="password"
                  placeholder="Supabase Anon Public Key"
                  value={supabaseAnonKey}
                  onChange={(e) => setSupabaseAnonKey(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono"
                />
                <input
                  type="text"
                  placeholder="Garage Sync Code (e.g. JETTA-GARAGE-1)"
                  value={syncRoomCode}
                  onChange={(e) => setSyncRoomCode(e.target.value.toUpperCase())}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-mono font-bold"
                />
                {cloudErrorMsg && <p className="text-xs text-rose-400">{cloudErrorMsg}</p>}
                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => setIsPhoneModalOpen(false)}
                    className="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300"
                  >
                    Close
                  </button>
                  <button
                    onClick={() => {
                      handleManualPullFromSupabase(false);
                      setIsPhoneModalOpen(false);
                    }}
                    className="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950"
                  >
                    Save & Sync Now
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Mobile Bottom Navigation */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-800 flex justify-around py-2.5 z-40">
            {[
              { id: 'dashboard', label: 'Ledger' },
              { id: 'guides', label: 'Guides' },
              { id: 'shelf', label: 'Shelf' },
              { id: 'tools', label: 'Tools' },
              { id: 'garage', label: 'Garage' }
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`text-xs font-bold px-2.5 py-1 rounded-lg ${
                  activeTab === tab.id ? 'bg-emerald-500/20 text-emerald-400' : 'text-slate-400'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
