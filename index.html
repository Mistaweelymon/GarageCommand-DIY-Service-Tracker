    const copyTextToClipboard = async (text) => {
      const str = String(text ?? '');
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(str);
          return true;
        }
      } catch (err) {}
      try {
        const textArea = document.createElement('textarea');
        textArea.value = str;
        textArea.setAttribute('readonly', '');
        textArea.style.position = 'fixed';
        textArea.style.top = '-9999px';
        document.body.appendChild(textArea);
        textArea.select();
        const copied = document.execCommand('copy');
        document.body.removeChild(textArea);
        return copied;
      } catch (e) {
        return false;
      }
    };

    const SUPABASE_SETUP_SQL = `-- Run this once in your Supabase SQL Editor:
create table if not exists public.garage_state (
  sync_code text primary key,
  payload jsonb not null,
  updated_at timestamptz default now(),
  client_id text
);

alter table public.garage_state enable row level security;

drop policy if exists "Allow anon read/write by sync_code" on public.garage_state;
create policy "Allow anon read/write by sync_code"
  on public.garage_state
  for all
  to anon, authenticated
  using (true)
  with check (true);`;

    const normalizeSupabaseUrl = (rawInput) => {
      const trimmed = (rawInput || '').trim().replace(/\/+$/, '');
      if (!trimmed) return '';
      const dashMatch = trimmed.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
      if (dashMatch && dashMatch[1]) return `https://${dashMatch[1].toLowerCase()}.supabase.co`;
      if (/^[a-z0-9]{15,25}$/i.test(trimmed)) return `https://${trimmed.toLowerCase()}.supabase.co`;
      if (!/^https?:\/\//i.test(trimmed) && trimmed.includes('.supabase.co')) return `https://${trimmed}`;
      return trimmed;
    };

    const supabaseRestPull = async (url, anonKey, syncCode) => {
      const cleanUrl = normalizeSupabaseUrl(url);
      const cleanCode = encodeURIComponent(syncCode.trim().toUpperCase());
      const res = await fetch(`${cleanUrl}/rest/v1/garage_state?sync_code=eq.${cleanCode}&select=sync_code,payload,updated_at,client_id`, {
        method: 'GET',
        headers: {
          apikey: anonKey.trim(),
          Authorization: `Bearer ${anonKey.trim()}`,
          'Content-Type': 'application/json'
        }
      });
      if (!res.ok) throw new Error(`Supabase Pull HTTP ${res.status}`);
      const rows = await res.json();
      return rows && rows.length > 0 ? rows[0] : null;
    };

    const supabaseRestPush = async (url, anonKey, syncCode, payloadObj, clientId) => {
      const cleanUrl = normalizeSupabaseUrl(url);
      const cleanCode = syncCode.trim().toUpperCase();
      const body = {
        sync_code: cleanCode,
        payload: payloadObj,
        updated_at: new Date().toISOString(),
        client_id: clientId
      };
      const res = await fetch(`${cleanUrl}/rest/v1/garage_state?on_conflict=sync_code`, {
        method: 'POST',
        headers: {
          apikey: anonKey.trim(),
          Authorization: `Bearer ${anonKey.trim()}`,
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates,return=representation'
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`Supabase Push HTTP ${res.status}`);
      return await res.json();
    };

      const [vehicles, setVehicles] = useState(savedLocalState?.vehicles || INITIAL_VEHICLES);
      const [selectedVehicleId, setSelectedVehicleId] = useState(savedLocalState?.selectedVehicleId || INITIAL_VEHICLES[0].id);
      const [tools, setTools] = useState(savedLocalState?.tools || INITIAL_TOOLS);
      const [shelf, setShelf] = useState(savedLocalState?.shelf || INITIAL_SHELF);
      const [guides, setGuides] = useState(savedLocalState?.guides || INITIAL_GUIDES);
      const [logs, setLogs] = useState(savedLocalState?.logs || INITIAL_LOGS);

      const [supabaseUrl, setSupabaseUrl] = useState(savedSupabaseCfg?.supabaseUrl || DEFAULT_SUPABASE_URL);
      const [supabaseAnonKey, setSupabaseAnonKey] = useState(savedSupabaseCfg?.supabaseAnonKey || DEFAULT_SUPABASE_ANON_KEY);
      const [syncRoomCode, setSyncRoomCode] = useState(savedSupabaseCfg?.syncRoomCode || DEFAULT_GARAGE_SYNC_CODE);
      const [clientId] = useState(() => savedSupabaseCfg?.clientId || `dev-${Math.random().toString(36).slice(2, 10)}`);

      const [cloudStatus, setCloudStatus] = useState(supabaseUrl && supabaseAnonKey ? 'connecting' : 'local-only');
      const [cloudErrorMsg, setCloudErrorMsg] = useState('');
      const [isPhoneModalOpen, setIsPhoneModalOpen] = useState(false);
      const [showSqlBox, setShowSqlBox] = useState(false);

      const isApplyingRemoteUpdate = useRef(false);
      const hasLoadedInitialCloud = useRef(false);
      const lastSyncedPayloadHash = useRef('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);
      const [logSearch, setLogSearch] = useState('');
      const [toolSearch, setToolSearch] = useState('');
      const [toolCatFilter, setToolCatFilter] = useState('ALL');

      // Modals state
      const [isLogModalOpen, setIsLogModalOpen] = useState(false);
      const [editingLogId, setEditingLogId] = useState(null);
      const [logForm, setLogForm] = useState({
        date: new Date().toISOString().slice(0, 10),
        odometer: '',
        serviceType: '',
        category: 'Maintenance',
        performedBy: 'DIY',
        cost: '',
        estimatedShopSavings: '',
        partsUsed: '',
        notes: '',
        guideId: '',
        deductShelf: true
      });

      const [isVehicleModalOpen, setIsVehicleModalOpen] = useState(false);
      const [editingVehicleId, setEditingVehicleId] = useState(null);
      const [vehicleForm, setVehicleForm] = useState({
        year: 2020, make: '', model: '', trim: '', odometer: 50000,
        oilSpec: '', coolantSpec: '', sparkPlugSpec: '', lugTorqueSpec: '', wiperSizes: '', notes: ''
      });

      const [isToolModalOpen, setIsToolModalOpen] = useState(false);
      const [toolForm, setToolForm] = useState({
        name: '', category: 'Sockets & Bits', owned: true, loanerAvailable: false, estBuyPrice: 20
      });

      const [isShelfModalOpen, setIsShelfModalOpen] = useState(false);
      const [shelfForm, setShelfForm] = useState({
        name: '', category: 'Fluids', vehicleId: 'ALL', partNumber: '', quantity: 1, unit: 'units', unitCost: 10
      });

      const [isGuideModalOpen, setIsGuideModalOpen] = useState(false);
      const [guideForm, setGuideForm] = useState({
        title: '', vehicleId: 'ALL', category: 'Maintenance', intervalMiles: 10000,
        estimatedDiyCost: 30, estimatedShopCost: 120, requiredToolsCsv: '', specsAndAdvice: ''
      });

      const showToast = useCallback((message) => {
        setToast(message);
        setTimeout(() => setToast((prev) => (prev === message ? null : prev)), 3200);
      }, []);

      // Save to localStorage
      useEffect(() => {
        try {
          localStorage.setItem(LOCAL_STORAGE_STATE_KEY, JSON.stringify({
            vehicles, selectedVehicleId, tools, shelf, guides, logs
          }));
        } catch (e) {}
      }, [vehicles, selectedVehicleId, tools, shelf, guides, logs]);

      useEffect(() => {
        try {
          localStorage.setItem(LOCAL_STORAGE_CONFIG_KEY, JSON.stringify({
            supabaseUrl, supabaseAnonKey, syncRoomCode, clientId
          }));
        } catch (e) {}
      }, [supabaseUrl, supabaseAnonKey, syncRoomCode, clientId]);

      const applyRemotePayload = useCallback((payload) => {
        if (!payload || typeof payload !== 'object') return;
        const incomingHash = JSON.stringify(payload);
        if (incomingHash === lastSyncedPayloadHash.current) return;

        lastSyncedPayloadHash.current = incomingHash;
        isApplyingRemoteUpdate.current = true;
        if (Array.isArray(payload.vehicles) && payload.vehicles.length > 0) setVehicles(payload.vehicles);
        if (payload.selectedVehicleId) setSelectedVehicleId(payload.selectedVehicleId);
        if (Array.isArray(payload.tools)) setTools(payload.tools);
        if (Array.isArray(payload.shelf)) setShelf(payload.shelf);
        if (Array.isArray(payload.guides)) setGuides(payload.guides);
        if (Array.isArray(payload.logs)) setLogs(payload.logs);
        setCloudStatus('synced');
        setCloudErrorMsg('');
        setTimeout(() => { isApplyingRemoteUpdate.current = false; }, 150);
      }, []);

      const handleManualPullFromSupabase = useCallback(async (silent = false) => {
        if (!supabaseUrl.trim() || !supabaseAnonKey.trim()) {
          setCloudStatus('local-only');
          return;
        }
        const cleanRoom = (syncRoomCode || 'DEFAULT-GARAGE').trim().toUpperCase();
        setCloudStatus('syncing');
        try {
          const row = await supabaseRestPull(supabaseUrl, supabaseAnonKey, cleanRoom);
          if (row && row.payload) {
            applyRemotePayload(row.payload);
            hasLoadedInitialCloud.current = true;
            if (!silent) showToast(`Synced room ${cleanRoom}!`);
          } else {
            const currentPayload = { vehicles, selectedVehicleId, tools, shelf, guides, logs };
            lastSyncedPayloadHash.current = JSON.stringify(currentPayload);
            await supabaseRestPush(supabaseUrl, supabaseAnonKey, cleanRoom, currentPayload, clientId);
            hasLoadedInitialCloud.current = true;
            setCloudStatus('synced');
            setCloudErrorMsg('');
            if (!silent) showToast(`Created cloud room ${cleanRoom}!`);
          }
        } catch (err) {
          setCloudStatus('error');
          setCloudErrorMsg(err.message || 'Supabase connection failed');
        }
      }, [supabaseUrl, supabaseAnonKey, syncRoomCode, vehicles, selectedVehicleId, tools, shelf, guides, logs, clientId, applyRemotePayload, showToast]);

      useEffect(() => {
        if (!supabaseUrl.trim() || !supabaseAnonKey.trim()) {
          setCloudStatus('local-only');
          return;
        }
        let isMounted = true;
        const cleanRoom = (syncRoomCode || 'DEFAULT-GARAGE').trim().toUpperCase();
        handleManualPullFromSupabase(true);

        const pollInterval = setInterval(async () => {
          if (!isMounted || isApplyingRemoteUpdate.current) return;
          try {
            const row = await supabaseRestPull(supabaseUrl, supabaseAnonKey, cleanRoom);
            if (row && row.payload && row.client_id !== clientId) {
              applyRemotePayload(row.payload);
            }
          } catch (e) {}
        }, 4000);
        return () => { isMounted = false; clearInterval(pollInterval); };
      }, [supabaseUrl, supabaseAnonKey, syncRoomCode, clientId, handleManualPullFromSupabase, applyRemotePayload]);

      useEffect(() => {
        if (!supabaseUrl.trim() || !supabaseAnonKey.trim() || !hasLoadedInitialCloud.current || isApplyingRemoteUpdate.current) return;
        const currentPayload = { vehicles, selectedVehicleId, tools, shelf, guides, logs };
        const payloadHash = JSON.stringify(currentPayload);
        if (payloadHash === lastSyncedPayloadHash.current) return;

        const cleanRoom = (syncRoomCode || 'DEFAULT-GARAGE').trim().toUpperCase();
        setCloudStatus('syncing');
        const timer = setTimeout(async () => {
          try {
            lastSyncedPayloadHash.current = payloadHash;
            await supabaseRestPush(supabaseUrl, supabaseAnonKey, cleanRoom, currentPayload, clientId);
            setCloudStatus('synced');
          } catch (err) {
            setCloudStatus('error');
            setCloudErrorMsg(err.message);
          }
        }, 450);
        return () => clearTimeout(timer);
      }, [vehicles, selectedVehicleId, tools, shelf, guides, logs, supabaseUrl, supabaseAnonKey, syncRoomCode, clientId]);

      const activeVehicle = useMemo(
        () => vehicles.find((v) => v.id === selectedVehicleId) || vehicles[0] || null,
        [vehicles, selectedVehicleId]
      );

      const evaluateToolReadiness = useMemo(() => {
        const toolMap = new Map();
        tools.forEach((t) => toolMap.set(t.name.toLowerCase().trim(), t));
        return (requiredToolNames = []) => {
          const details = requiredToolNames.map((reqName) => {
            const match = toolMap.get(reqName.toLowerCase().trim());
            return {
              name: reqName,
              owned: match ? Boolean(match.owned) : false,
              loanerAvailable: match ? Boolean(match.loanerAvailable) : false,
              estBuyPrice: match ? Number(match.estBuyPrice || 20) : 20
            };
          });
          const missingCount = details.filter((d) => !d.owned).length;
          return { isReady: missingCount === 0, missingCount, totalCount: details.length, details };
        };
      }, [tools]);

      const handleToggleToolByName = (toolName) => {
        const existing = tools.find((t) => t.name.toLowerCase().trim() === toolName.toLowerCase().trim());
        if (existing) {
          const nextOwned = !existing.owned;
          setTools((prev) => prev.map((t) => (t.id === existing.id ? { ...t, owned: nextOwned } : t)));
          showToast(nextOwned ? `Marked "${existing.name}" Owned` : `Marked "${existing.name}" Missing`);
        } else {
          const newTool = {
            id: `t-${Date.now()}`,
            name: toolName,
            category: 'Specialty & Diagnostics',
            owned: true,
            loanerAvailable: false,
            estBuyPrice: 20
          };
          setTools((prev) => [...prev, newTool]);
          showToast(`Added & Marked "${toolName}" Owned`);
        }
      };

      // Open Log Modal (Add or Edit or From Guide)
      const openAddLogModal = (guide = null) => {
        setEditingLogId(null);
        if (guide) {
          const partsStr = (guide.requiredParts || []).map((p) => `${p.qty}x ${p.name}`).join(', ');
          setLogForm({
            date: new Date().toISOString().slice(0, 10),
            odometer: activeVehicle ? activeVehicle.odometer : 100000,
            serviceType: guide.title,
            category: guide.category || 'Maintenance',
            performedBy: 'DIY',
            cost: guide.estimatedDiyCost ?? 0,
            estimatedShopSavings: Math.max(0, (guide.estimatedShopCost || 0) - (guide.estimatedDiyCost || 0)),
            partsUsed: partsStr,
            notes: `Completed per guide. ${guide.specsAndAdvice || ''}`.slice(0, 180),
            guideId: guide.id,
            deductShelf: true
          });
        } else {
          setLogForm({
            date: new Date().toISOString().slice(0, 10),
            odometer: activeVehicle ? activeVehicle.odometer : 100000,
            serviceType: '',
            category: 'Maintenance',
            performedBy: 'DIY',
            cost: '',
            estimatedShopSavings: '',
            partsUsed: '',
            notes: '',
            guideId: '',
            deductShelf: false
          });
        }
        setIsLogModalOpen(true);
      };

      const openEditLogModal = (log) => {
        setEditingLogId(log.id);
        setLogForm({
          date: log.date,
          odometer: log.odometer,
          serviceType: log.serviceType,
          category: log.category || 'Maintenance',
          performedBy: log.performedBy || 'DIY',
          cost: log.cost,
          estimatedShopSavings: log.estimatedShopSavings || 0,
          partsUsed: log.partsUsed || '',
          notes: log.notes || '',
          guideId: log.guideId || '',
          deductShelf: false
        });
        setIsLogModalOpen(true);
      };

      const handleSaveLog = (e) => {
        e.preventDefault();
        if (!logForm.serviceType.trim()) return;
        const odoNum = parseInt(logForm.odometer, 10) || (activeVehicle ? activeVehicle.odometer : 0);
        const costNum = parseFloat(logForm.cost) || 0;
        const savingsNum = parseFloat(logForm.estimatedShopSavings) || 0;

        if (editingLogId) {
          setLogs((prev) =>
            prev.map((l) =>
              l.id === editingLogId
                ? {
                    ...l,
                    date: logForm.date,
                    odometer: odoNum,
                    serviceType: logForm.serviceType.trim(),
                    category: logForm.category,
                    performedBy: logForm.performedBy,
                    cost: costNum,
                    estimatedShopSavings: savingsNum,
                    partsUsed: logForm.partsUsed,
                    notes: logForm.notes
                  }
                : l
            )
          );
          showToast('Updated service record!');
        } else {
          const newLog = {
            id: `log-${Date.now()}`,
            vehicleId: activeVehicle ? activeVehicle.id : vehicles[0].id,
            guideId: logForm.guideId || null,
            date: logForm.date,
            odometer: odoNum,
            serviceType: logForm.serviceType.trim(),
            category: logForm.category,
            performedBy: logForm.performedBy,
            cost: costNum,
            estimatedShopSavings: savingsNum,
            partsUsed: logForm.partsUsed,
            notes: logForm.notes
          };
          setLogs((prev) => [newLog, ...prev]);

          // Update vehicle odometer if new log odometer is higher
          if (activeVehicle && odoNum > activeVehicle.odometer) {
            setVehicles((prev) =>
              prev.map((v) => (v.id === activeVehicle.id ? { ...v, odometer: odoNum } : v))
            );
          }

          // Auto-deduct from shelf if triggered from a guide
          if (logForm.deductShelf && logForm.guideId) {
            const matchedGuide = guides.find((g) => g.id === logForm.guideId);
            if (matchedGuide && Array.isArray(matchedGuide.requiredParts)) {
              setShelf((prevShelf) =>
                prevShelf.map((item) => {
                  const req = matchedGuide.requiredParts.find(
                    (p) => p.name.toLowerCase().trim() === item.name.toLowerCase().trim()
                  );
                  if (req) {
                    return { ...item, quantity: Math.max(0, Number(item.quantity) - Number(req.qty || 1)) };
                  }
                  return item;
                })
              );
            }
          }
          showToast('Service logged & odometer updated!');
        }
        setIsLogModalOpen(false);
      };

      const handleDeleteLog = (id) => {
        if (!window.confirm('Delete this service log?')) return;
        setLogs((prev) => prev.filter((l) => l.id !== id));
        showToast('Deleted service log.');
      };

      // Vehicle Add / Edit / Delete
      const openAddVehicleModal = () => {
        setEditingVehicleId(null);
        setVehicleForm({
          year: 2020, make: '', model: '', trim: '', odometer: 50000,
          oilSpec: 'SAE 5W-30 Full Synthetic', coolantSpec: '50/50 Prediluted Coolant',
          sparkPlugSpec: 'Iridium / Platinum', lugTorqueSpec: '85 lb-ft', wiperSizes: '24" / 19"', notes: ''
        });
        setIsVehicleModalOpen(true);
      };

      const openEditVehicleModal = (v) => {
        setEditingVehicleId(v.id);
        setVehicleForm({
          year: v.year, make: v.make, model: v.model, trim: v.trim || '', odometer: v.odometer || 0,
          oilSpec: v.oilSpec || '', coolantSpec: v.coolantSpec || '', sparkPlugSpec: v.sparkPlugSpec || '',
          lugTorqueSpec: v.lugTorqueSpec || '', wiperSizes: v.wiperSizes || '', notes: v.notes || ''
        });
        setIsVehicleModalOpen(true);
      };

      const handleSaveVehicle = (e) => {
        e.preventDefault();
        if (!vehicleForm.make.trim() || !vehicleForm.model.trim()) return;
        if (editingVehicleId) {
          setVehicles((prev) =>
            prev.map((v) =>
              v.id === editingVehicleId
                ? { ...v, ...vehicleForm, year: parseInt(vehicleForm.year, 10) || 2020, odometer: parseInt(vehicleForm.odometer, 10) || 0 }
                : v
            )
          );
          showToast('Updated vehicle specs!');
        } else {
          const newV = {
            id: `v-${Date.now()}`,
            ...vehicleForm,
            year: parseInt(vehicleForm.year, 10) || 2020,
            odometer: parseInt(vehicleForm.odometer, 10) || 0,
            partNumbers: []
          };
          setVehicles((prev) => [...prev, newV]);
          setSelectedVehicleId(newV.id);
          showToast(`Added ${newV.year} ${newV.make} ${newV.model}!`);
        }
        setIsVehicleModalOpen(false);
      };

      const handleDeleteVehicle = (id) => {
        if (vehicles.length <= 1) {
          alert('You must keep at least one vehicle in your garage.');
          return;
        }
        if (!window.confirm('Remove this vehicle from your garage?')) return;
        const remaining = vehicles.filter((v) => v.id !== id);
        setVehicles(remaining);
        if (selectedVehicleId === id) setSelectedVehicleId(remaining[0].id);
        showToast('Removed vehicle.');
      };

      // Tool Add / Delete
      const handleSaveTool = (e) => {
        e.preventDefault();
        if (!toolForm.name.trim()) return;
        const newTool = {
          id: `t-${Date.now()}`,
          name: toolForm.name.trim(),
          category: toolForm.category,
          owned: Boolean(toolForm.owned),
          loanerAvailable: Boolean(toolForm.loanerAvailable),
          estBuyPrice: parseFloat(toolForm.estBuyPrice) || 20
        };
        setTools((prev) => [newTool, ...prev]);
        setIsToolModalOpen(false);
        setToolForm({ name: '', category: 'Sockets & Bits', owned: true, loanerAvailable: false, estBuyPrice: 20 });
        showToast(`Added "${newTool.name}" to Tool Chest!`);
      };

      const handleDeleteTool = (id, e) => {
        e.stopPropagation();
        if (!window.confirm('Remove this tool from your list?')) return;
        setTools((prev) => prev.filter((t) => t.id !== id));
        showToast('Removed tool.');
      };

      // Shelf Add / Delete
      const handleSaveShelfItem = (e) => {
        e.preventDefault();
        if (!shelfForm.name.trim()) return;
        const newItem = {
          id: `s-${Date.now()}`,
          name: shelfForm.name.trim(),
          category: shelfForm.category,
          vehicleId: shelfForm.vehicleId,
          partNumber: shelfForm.partNumber.trim() || 'N/A',
          quantity: parseFloat(shelfForm.quantity) || 1,
          unit: shelfForm.unit.trim() || 'units',
          unitCost: parseFloat(shelfForm.unitCost) || 0
        };
        setShelf((prev) => [newItem, ...prev]);
        setIsShelfModalOpen(false);
        setShelfForm({ name: '', category: 'Fluids', vehicleId: 'ALL', partNumber: '', quantity: 1, unit: 'units', unitCost: 10 });
        showToast(`Added "${newItem.name}" to Garage Shelf!`);
      };

      const handleDeleteShelfItem = (id) => {
        if (!window.confirm('Remove this item from your shelf?')) return;
        setShelf((prev) => prev.filter((s) => s.id !== id));
        showToast('Removed shelf item.');
      };

      // Guide Add / Delete
      const handleSaveGuide = (e) => {
        e.preventDefault();
        if (!guideForm.title.trim()) return;
        const reqTools = guideForm.requiredToolsCsv
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean);
        const newGuide = {
          id: `g-${Date.now()}`,
          title: guideForm.title.trim(),
          vehicleId: guideForm.vehicleId,
          category: guideForm.category,
          intervalMiles: parseInt(guideForm.intervalMiles, 10) || 10000,
          estimatedDiyCost: parseFloat(guideForm.estimatedDiyCost) || 25,
          estimatedShopCost: parseFloat(guideForm.estimatedShopCost) || 100,
          requiredTools: reqTools,
          requiredParts: [],
          specsAndAdvice: guideForm.specsAndAdvice.trim() || 'Custom DIY service guide.'
        };
        setGuides((prev) => [newGuide, ...prev]);
        setIsGuideModalOpen(false);
        setGuideForm({ title: '', vehicleId: 'ALL', category: 'Maintenance', intervalMiles: 10000, estimatedDiyCost: 30, estimatedShopCost: 120, requiredToolsCsv: '', specsAndAdvice: '' });
        showToast('Added custom DIY Service Guide!');
      };

      const handleDeleteGuide = (id) => {
        if (!window.confirm('Delete this service guide?')) return;
        setGuides((prev) => prev.filter((g) => g.id !== id));
        showToast('Deleted service guide.');
      };

      // Export CSV & JSON Backup
      const handleExportCsv = () => {
        const headers = ['Date', 'Vehicle', 'Odometer', 'Service', 'Category', 'PerformedBy', 'Cost', 'Savings', 'PartsUsed', 'Notes'];
        const rows = logs.map((l) => {
          const v = vehicles.find((veh) => veh.id === l.vehicleId);
          const vName = v ? `${v.year} ${v.make} ${v.model}` : l.vehicleId;
          return [
            l.date,
            `"${vName}"`,
            l.odometer,
            `"${(l.serviceType || '').replace(/"/g, '""')}"`,
            l.category,
            l.performedBy,
            l.cost,
            l.estimatedShopSavings || 0,
            `"${(l.partsUsed || '').replace(/"/g, '""')}"`,
            `"${(l.notes || '').replace(/"/g, '""')}"`
          ].join(',');
        });
        const csv = [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `GarageCommand_Logs_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Exported CSV!');
      };

      const handleExportJson = () => {
        const data = JSON.stringify({ vehicles, selectedVehicleId, tools, shelf, guides, logs }, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `GarageCommand_Backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Downloaded full JSON backup!');
      };

      const handleImportJson = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed.vehicles) setVehicles(parsed.vehicles);
            if (parsed.tools) setTools(parsed.tools);
            if (parsed.shelf) setShelf(parsed.shelf);
            if (parsed.guides) setGuides(parsed.guides);
            if (parsed.logs) setLogs(parsed.logs);
            showToast('Restored garage backup!');
          } catch (err) {
            alert('Invalid backup JSON file.');
          }
        };
        reader.readAsText(file);
      };

      const filteredLogs = useMemo(() => {
        return logs
          .filter((l) => (activeVehicle ? l.vehicleId === activeVehicle.id : true))
          .filter((l) => {
            if (!logSearch.trim()) return true;
            const q = logSearch.toLowerCase();
            return (
              (l.serviceType || '').toLowerCase().includes(q) ||
              (l.partsUsed || '').toLowerCase().includes(q) ||
              (l.notes || '').toLowerCase().includes(q)
            );
          })
          .sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [logs, activeVehicle, logSearch]);

      const vehicleTotalSpend = useMemo(
        () => filteredLogs.reduce((sum, l) => sum + (Number(l.cost) || 0), 0),
        [filteredLogs]
      );
      const vehicleTotalSavings = useMemo(
        () => filteredLogs.reduce((sum, l) => sum + (Number(l.estimatedShopSavings) || 0), 0),
        [filteredLogs]
      );

      const filteredTools = useMemo(() => {
        return tools
          .filter((t) => (toolCatFilter === 'ALL' ? true : t.category === toolCatFilter))
          .filter((t) => (!toolSearch.trim() ? true : t.name.toLowerCase().includes(toolSearch.toLowerCase())));
      }, [tools, toolCatFilter, toolSearch]);

      return (
        <div className="min-h-screen pb-24 md:pb-12 bg-slate-950 text-slate-100 flex flex-col">
          {toast && (
            <div className="fixed bottom-20 md:bottom-6 right-4 z-50 flex items-center gap-2 px-4 py-3 rounded-xl bg-slate-900 border border-emerald-500/50 text-white shadow-2xl">
              <CheckCircle2 className="w-4 h-4 text-emerald-400 shrink-0" />
              <span className="text-xs font-semibold">{toast}</span>
            </div>
          )}

          {/* Top Header */}
          <header className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 font-bold">
                  <Wrench className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="text-base font-bold text-white">
                    Garage<span className="text-emerald-400">Command</span> PRO
                  </h1>
                  <p className="text-[11px] text-slate-400 hidden sm:block">
                    Interactive DIY Service, Expense & Tool Readiness Tracker
                  </p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <select
                  value={selectedVehicleId}
                  onChange={(e) => setSelectedVehicleId(e.target.value)}
                  className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs font-semibold text-white"
                >
                  {vehicles.map((v) => (
                    <option key={v.id} value={v.id}>
                      {v.year} {v.make} {v.model} ({Number(v.odometer).toLocaleString()} mi)
                    </option>
                  ))}
                </select>

                <button
                  onClick={openAddVehicleModal}
                  className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"
                  title="Add a Vehicle"
                >
                  <Plus className="w-3.5 h-3.5 text-emerald-400" />
                  <span className="hidden sm:inline">Add Vehicle</span>
                </button>

                <button
                  onClick={() => setIsPhoneModalOpen(true)}
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30"
                >
                  <Smartphone className="w-3.5 h-3.5" />
                  <span>{cloudStatus === 'synced' ? 'Supabase Live' : 'Cloud Sync'}</span>
                </button>
              </div>
            </div>

            {/* Desktop Tabs */}
            <div className="max-w-7xl mx-auto px-4 pb-2 hidden md:flex items-center justify-between">
              <div className="flex items-center gap-1.5">
                {[
                  { id: 'dashboard', label: `Service Ledger (${filteredLogs.length})` },
                  { id: 'guides', label: `DIY Service Guides (${guides.length})` },
                  { id: 'shelf', label: `Garage Shelf (${shelf.length})` },
                  { id: 'tools', label: `My Tool Chest (${tools.filter((t) => t.owned).length}/${tools.length})` },
                  { id: 'garage', label: `My Garage (${vehicles.length})` }
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                      activeTab === tab.id
                        ? 'bg-emerald-500 text-slate-950 font-bold'
                        : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={handleExportJson}
                  className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300"
                >
                  <Download className="w-3 h-3" /> Backup JSON
                </button>
                <label className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer">
                  <Upload className="w-3 h-3" /> Restore
                  <input type="file" accept=".json" onChange={handleImportJson} className="hidden" />
                </label>
              </div>
            </div>
          </header>

          {/* Active Vehicle Banner */}
          {activeVehicle && (
            <div className="bg-slate-900/80 border-b border-slate-800 px-4 py-2.5">
              <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs">
                <div className="flex flex-wrap items-center gap-2">
                  <strong className="text-white text-sm">
                    {activeVehicle.year} {activeVehicle.make} {activeVehicle.model}
                  </strong>
                  <span className="px-2 py-0.5 rounded bg-slate-800 text-emerald-400">
                    Oil: {activeVehicle.oilSpec}
                  </span>
                  <span className="px-2 py-0.5 rounded bg-slate-800 text-purple-300">
                    Coolant: {activeVehicle.coolantSpec}
                  </span>
                  {activeVehicle.lugTorqueSpec && (
                    <span className="px-2 py-0.5 rounded bg-slate-800 text-amber-300">
                      Lug Torque: {activeVehicle.lugTorqueSpec}
                    </span>
                  )}
                </div>
                <div className="flex items-center gap-3 font-mono">
                  <span>Odometer: <strong>{Number(activeVehicle.odometer).toLocaleString()} mi</strong></span>
                  <button
                    onClick={() => {
                      const next = prompt('Update current odometer reading (miles):', activeVehicle.odometer);
                      if (next && !isNaN(parseInt(next, 10))) {
                        setVehicles((prev) =>
                          prev.map((v) => (v.id === activeVehicle.id ? { ...v, odometer: parseInt(next, 10) } : v))
                        );
                        showToast('Updated odometer!');
                      }
                    }}
                    className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30 font-sans font-semibold"
                  >
                    Update Mileage
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Main Workspace */}
          <main className="max-w-7xl w-full mx-auto px-4 py-5 space-y-5 flex-1">
            {/* TAB 1: SERVICE LEDGER */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                {/* Summary KPI Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div className="p-3.5 rounded-2xl bg-slate-900 border border-slate-800">
                    <span className="text-[11px] text-slate-400">Total Spent ({activeVehicle?.model})</span>
                    <div className="text-lg font-bold text-white font-mono mt-0.5">
                      ${vehicleTotalSpend.toFixed(2)}
                    </div>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-slate-900 border border-slate-800">
                    <span className="text-[11px] text-slate-400">Est. DIY Labor Saved</span>
                    <div className="text-lg font-bold text-emerald-400 font-mono mt-0.5">
                      +${vehicleTotalSavings.toFixed(2)}
                    </div>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-slate-900 border border-slate-800">
                    <span className="text-[11px] text-slate-400">Logged Services</span>
                    <div className="text-lg font-bold text-white font-mono mt-0.5">
                      {filteredLogs.length}
                    </div>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-slate-900 border border-slate-800">
                    <span className="text-[11px] text-slate-400">Tools Owned</span>
                    <div className="text-lg font-bold text-cyan-400 font-mono mt-0.5">
                      {tools.filter((t) => t.owned).length} / {tools.length}
                    </div>
                  </div>
                </div>

                {/* Action Bar */}
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center gap-2 flex-1 min-w-[200px]">
                    <input
                      type="text"
                      value={logSearch}
                      onChange={(e) => setLogSearch(e.target.value)}
                      placeholder="Search service logs, parts, notes..."
                      className="w-full max-w-xs bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleExportCsv}
                      className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800"
                    >
                      <Download className="w-3.5 h-3.5" /> Export CSV
                    </button>
                    <button
                      onClick={() => openAddLogModal(null)}
                      className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-lg"
                    >
                      <Plus className="w-4 h-4" /> Log Service / Expense
                    </button>
                  </div>
                </div>

                {/* Logs List */}
                {filteredLogs.length === 0 ? (
                  <div className="p-8 rounded-2xl bg-slate-900/60 border border-slate-800 text-center space-y-2">
                    <p className="text-sm text-slate-300 font-semibold">No service records found for this vehicle.</p>
                    <button
                      onClick={() => openAddLogModal(null)}
                      className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950"
                    >
                      <Plus className="w-4 h-4" /> Log First Service
                    </button>
                  </div>
                ) : (
                  <div className="space-y-2.5">
                    {filteredLogs.map((log) => (
                      <div
                        key={log.id}
                        className="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3"
                      >
                        <div className="space-y-1">
                          <div className="flex flex-wrap items-center gap-2">
                            <span className="font-bold text-sm text-white">{log.serviceType}</span>
                            <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 font-semibold">
                              {log.performedBy}
                            </span>
                            <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">
                              {log.category}
                            </span>
                          </div>
                          <p className="text-xs text-slate-400">
                            {log.date} • <strong>{Number(log.odometer).toLocaleString()} mi</strong>
                            {log.partsUsed ? ` • Parts: ${log.partsUsed}` : ''}
                          </p>
                          {log.notes && <p className="text-xs text-slate-300">{log.notes}</p>}
                        </div>

                        <div className="flex items-center justify-between sm:justify-end gap-3 border-t sm:border-t-0 border-slate-800 pt-2 sm:pt-0">
                          <div className="text-left sm:text-right">
                            <div className="font-mono font-bold text-sm text-white">
                              ${Number(log.cost).toFixed(2)}
                            </div>
                            {Number(log.estimatedShopSavings) > 0 && (
                              <div className="text-[10px] font-mono text-emerald-400">
                                Saved ${Number(log.estimatedShopSavings).toFixed(0)}
                              </div>
                            )}
                          </div>
                          <div className="flex items-center gap-1">
                            <button
                              onClick={() => openEditLogModal(log)}
                              className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"
                              title="Edit Service"
                            >
                              <Edit3 className="w-3.5 h-3.5" />
                            </button>
                            <button
                              onClick={() => handleDeleteLog(log.id)}
                              className="p-2 rounded-lg bg-rose-500/15 hover:bg-rose-500/30 text-rose-300"
                              title="Delete Service"
                            >
                              <Trash2 className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: DIY SERVICE GUIDES */}
            {activeTab === 'guides' && (
              <div className="space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h2 className="text-base font-bold text-white">Smart DIY Service Guides & Tool Readiness</h2>
                    <p className="text-xs text-slate-400">
                      Click any tool chip to toggle Owned/Missing, or click "Complete & Log Job" to record it.
                    </p>
                  </div>
                  <button
                    onClick={() => setIsGuideModalOpen(true)}
                    className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950"
                  >
                    <Plus className="w-4 h-4" /> Add Custom Guide
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {guides
                    .filter((g) => !activeVehicle || g.vehicleId === activeVehicle.id || g.vehicleId === 'ALL')
                    .map((guide) => {
                      const readiness = evaluateToolReadiness(guide.requiredTools);
                      const lastMatchingLog = logs
                        .filter((l) => l.vehicleId === activeVehicle?.id && (l.guideId === guide.id || l.serviceType === guide.title))
                        .sort((a, b) => b.odometer - a.odometer)[0];

                      const milesSinceLast = lastMatchingLog && activeVehicle
                        ? Math.max(0, activeVehicle.odometer - lastMatchingLog.odometer)
                        : null;
                      const milesRemaining = milesSinceLast !== null && guide.intervalMiles
                        ? guide.intervalMiles - milesSinceLast
                        : null;

                      return (
                        <div
                          key={guide.id}
                          className="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col justify-between space-y-3"
                        >
                          <div className="space-y-2.5">
                            <div className="flex items-center justify-between gap-2">
                              <span
                                className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${
                                  readiness.isReady
                                    ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                                    : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                                }`}
                              >
                                {readiness.isReady ? '✓ READY TO DIY' : `MISSING ${readiness.missingCount} TOOL(S)`}
                              </span>

                              <div className="flex items-center gap-2">
                                <span className="text-xs text-slate-400 font-mono">
                                  Every {Number(guide.intervalMiles).toLocaleString()} mi
                                </span>
                                <button
                                  onClick={() => handleDeleteGuide(guide.id)}
                                  className="p-1 rounded hover:bg-rose-500/20 text-slate-500 hover:text-rose-300"
                                  title="Delete Guide"
                                >
                                  <Trash2 className="w-3.5 h-3.5" />
                                </button>
                              </div>
                            </div>

                            <h3 className="text-sm font-bold text-white">{guide.title}</h3>

                            {milesRemaining !== null ? (
                              <div className="text-xs font-mono px-2.5 py-1.5 rounded-lg bg-slate-950 border border-slate-800 flex items-center justify-between">
                                <span className="text-slate-400">Last done at {lastMatchingLog.odometer.toLocaleString()} mi</span>
                                <span className={milesRemaining <= 0 ? 'text-rose-400 font-bold' : 'text-emerald-400 font-bold'}>
                                  {milesRemaining <= 0
                                    ? `OVERDUE by ${Math.abs(milesRemaining).toLocaleString()} mi`
                                    : `Due in ${milesRemaining.toLocaleString()} mi`}
                                </span>
                              </div>
                            ) : (
                              <div className="text-[11px] text-slate-400 px-2.5 py-1 rounded-lg bg-slate-950 border border-slate-800">
                                Not logged yet for this vehicle
                              </div>
                            )}

                            <p className="text-xs text-slate-300 leading-relaxed">{guide.specsAndAdvice}</p>

                            <div className="space-y-1 pt-1">
                              <span className="text-[10px] uppercase tracking-wider text-slate-400 font-bold">
                                Required Tools (Click to Toggle Owned):
                              </span>
                              <div className="flex flex-wrap gap-1.5">
                                {readiness.details.map((t, i) => (
                                  <button
                                    key={i}
                                    onClick={() => handleToggleToolByName(t.name)}
                                    className={`px-2 py-1 rounded-lg text-[11px] font-medium border transition ${
                                      t.owned
                                        ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
                                        : 'bg-rose-500/15 border-rose-500/40 text-rose-300'
                                    }`}
                                  >
                                    {t.owned ? '✓ ' : '✗ '}
                                    {t.name}
                                    {!t.owned && t.loanerAvailable ? ' (Free Loaner)' : ''}
                                  </button>
                                ))}
                              </div>
                            </div>
                          </div>

                          <div className="pt-3 border-t border-slate-800 flex items-center justify-between gap-2">
                            <span className="text-xs text-slate-400">
                              Est. DIY: <strong className="text-white">${guide.estimatedDiyCost}</strong> (Saves ~$
                              {Math.max(0, (guide.estimatedShopCost || 0) - (guide.estimatedDiyCost || 0))})
                            </span>
                            <button
                              onClick={() => openAddLogModal(guide)}
                              className="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950"
                            >
                              Complete & Log Job
                            </button>
                          </div>
                        </div>
                      );
                    })}
                </div>
              </div>
            )}

            {/* TAB 3: GARAGE SHELF */}
            {activeTab === 'shelf' && (
              <div className="space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h2 className="text-base font-bold text-white">Garage Shelf (Parts, Fluids & Bulbs Inventory)</h2>
                    <p className="text-xs text-slate-400">
                      Track spare quarts of oil, filters, and bulbs sitting in your garage.
                    </p>
                  </div>
                  <button
                    onClick={() => setIsShelfModalOpen(true)}
                    className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950"
                  >
                    <Plus className="w-4 h-4" /> Add Shelf Item
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {shelf.map((item) => (
                    <div
                      key={item.id}
                      className="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between gap-2"
                    >
                      <div className="space-y-0.5">
                        <span className="text-[10px] uppercase text-cyan-400 font-bold">{item.category}</span>
                        <h4 className="text-sm font-bold text-white">{item.name}</h4>
                        <span className="text-xs text-slate-400 font-mono block">
                          PN: {item.partNumber} ({item.unit})
                        </span>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <button
                          onClick={() =>
                            setShelf((prev) =>
                              prev.map((s) => (s.id === item.id ? { ...s, quantity: Math.max(0, Number(s.quantity) - 1) } : s))
                            )
                          }
                          className="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold"
                        >
                          -
                        </button>
                        <span className="font-mono font-bold text-base text-emerald-400 w-7 text-center">
                          {item.quantity}
                        </span>
                        <button
                          onClick={() =>
                            setShelf((prev) =>
                              prev.map((s) => (s.id === item.id ? { ...s, quantity: Number(s.quantity) + 1 } : s))
                            )
                          }
                          className="w-7 h-7 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 font-bold"
                        >
                          +
                        </button>
                        <button
                          onClick={() => handleDeleteShelfItem(item.id)}
                          className="p-1.5 rounded-lg text-slate-500 hover:text-rose-400 ml-1"
                          title="Delete Item"
                        >
                          <Trash2 className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 4: MY TOOL CHEST */}
            {activeTab === 'tools' && (
              <div className="space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex flex-wrap items-center gap-2">
                    <input
                      type="text"
                      value={toolSearch}
                      onChange={(e) => setToolSearch(e.target.value)}
                      placeholder="Search sockets, wrenches, tools..."
                      className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white"
                    />
                    <select
                      value={toolCatFilter}
                      onChange={(e) => setToolCatFilter(e.target.value)}
                      className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white"
                    >
                      <option value="ALL">All Categories</option>
                      {TOOL_CATEGORIES.map((c) => (
                        <option key={c} value={c}>{c}</option>
                      ))}
                    </select>
                  </div>
                  <button
                    onClick={() => setIsToolModalOpen(true)}
                    className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950"
                  >
                    <Plus className="w-4 h-4" /> Add Custom Tool
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {filteredTools.map((tool) => (
                    <div
                      key={tool.id}
                      onClick={() => handleToggleToolByName(tool.name)}
                      className={`p-3.5 rounded-2xl border cursor-pointer flex items-center justify-between gap-2 transition ${
                        tool.owned
                          ? 'bg-slate-900 border-emerald-500/30 hover:border-emerald-500/60'
                          : 'bg-slate-900/50 border-slate-800 hover:border-slate-700'
                      }`}
                    >
                      <div>
                        <div className="flex items-center gap-1.5">
                          <span className="text-[10px] text-slate-400">{tool.category}</span>
                          {tool.loanerAvailable && !tool.owned && (
                            <span className="text-[9px] px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-300 font-semibold">
                              Free Loan-A-Tool
                            </span>
                          )}
                        </div>
                        <h4 className="text-xs font-bold text-white mt-0.5">{tool.name}</h4>
                      </div>
                      <div className="flex items-center gap-1.5 shrink-0">
                        <span
                          className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${
                            tool.owned ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'
                          }`}
                        >
                          {tool.owned ? 'Owned' : 'Missing'}
                        </span>
                        <button
                          onClick={(e) => handleDeleteTool(tool.id, e)}
                          className="p-1.5 rounded text-slate-500 hover:text-rose-400"
                          title="Delete Tool"
                        >
                          <Trash2 className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 5: MY GARAGE */}
            {activeTab === 'garage' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-bold text-white">My Garage Vehicles & Fluid Specs</h2>
                  <button
                    onClick={openAddVehicleModal}
                    className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950"
                  >
                    <Plus className="w-4 h-4" /> Add Vehicle
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {vehicles.map((v) => (
                    <div key={v.id} className="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
                      <div className="flex items-start justify-between gap-2">
                        <div>
                          <h3 className="text-base font-bold text-white">
                            {v.year} {v.make} {v.model} <span className="text-xs text-slate-400">({v.trim})</span>
                          </h3>
                          <span className="text-xs font-mono text-emerald-400">
                            Odometer: {Number(v.odometer).toLocaleString()} miles
                          </span>
                        </div>
                        <div className="flex items-center gap-1">
                          <button
                            onClick={() => openEditVehicleModal(v)}
                            className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200"
                            title="Edit Vehicle"
                          >
                            <Edit3 className="w-3.5 h-3.5" />
                          </button>
                          <button
                            onClick={() => handleDeleteVehicle(v.id)}
                            className="p-2 rounded-lg bg-rose-500/15 hover:bg-rose-500/30 text-rose-300"
                            title="Delete Vehicle"
                          >
                            <Trash2 className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>

                      <div className="text-xs space-y-1 text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <p><strong className="text-slate-400">Engine Oil:</strong> {v.oilSpec}</p>
                        <p><strong className="text-slate-400">Coolant:</strong> {v.coolantSpec}</p>
                        <p><strong className="text-slate-400">Spark Plugs:</strong> {v.sparkPlugSpec}</p>
                        <p><strong className="text-slate-400">Lug Torque:</strong> {v.lugTorqueSpec}</p>
                        <p><strong className="text-slate-400">Wipers / Bulbs:</strong> {v.wiperSizes}</p>
                        {v.notes && <p className="text-slate-400 pt-1">{v.notes}</p>}
                      </div>

                      {Array.isArray(v.partNumbers) && v.partNumbers.length > 0 && (
                        <div className="space-y-1">
                          <span className="text-[10px] uppercase text-slate-400 font-bold">
                            Quick Store-Aisle Part Numbers (Click to Copy):
                          </span>
                          <div className="flex flex-wrap gap-1.5">
                            {v.partNumbers.map((pn) => (
                              <button
                                key={pn.id}
                                onClick={() => {
                                  copyTextToClipboard(pn.number);
                                  showToast(`Copied ${pn.number}!`);
                                }}
                                className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] text-slate-200 font-mono"
                              >
                                {pn.part}: <strong className="text-emerald-400">{pn.number}</strong>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* MODAL 1: ADD / EDIT SERVICE LOG */}
          {isLogModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 p-4 overflow-y-auto">
              <form
                onSubmit={handleSaveLog}
                className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 space-y-3"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">
                    {editingLogId ? 'Edit Service Record' : `Log Service — ${activeVehicle?.year} ${activeVehicle?.model}`}
                  </h3>
                  <button type="button" onClick={() => setIsLogModalOpen(false)} className="text-slate-400">✕</button>
                </div>

                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Date</label>
                    <input
                      type="date"
                      required
                      value={logForm.date}
                      onChange={(e) => setLogForm({ ...logForm, date: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Odometer (miles)</label>
                    <input
                      type="number"
                      required
                      value={logForm.odometer}
                      onChange={(e) => setLogForm({ ...logForm, odometer: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Service Title / Description</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g., Engine Oil & Filter Change, Rear Shocks, Brake Flush..."
                    value={logForm.serviceType}
                    onChange={(e) => setLogForm({ ...logForm, serviceType: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Category</label>
                    <select
                      value={logForm.category}
                      onChange={(e) => setLogForm({ ...logForm, category: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                    >
                      {SERVICE_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Performed By</label>
                    <select
                      value={logForm.performedBy}
                      onChange={(e) => setLogForm({ ...logForm, performedBy: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                    >
                      <option value="DIY">DIY (Home Garage)</option>
                      <option value="Shop">Shop / Dealership</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Total Cost ($)</label>
                    <input
                      type="number"
                      step="0.01"
                      placeholder="0.00"
                      value={logForm.cost}
                      onChange={(e) => setLogForm({ ...logForm, cost: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Est. DIY Labor Saved ($)</label>
                    <input
                      type="number"
                      step="0.01"
                      placeholder="0.00"
                      value={logForm.estimatedShopSavings}
                      onChange={(e) => setLogForm({ ...logForm, estimatedShopSavings: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-mono"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Parts / Fluids Used</label>
                  <input
                    type="text"
                    placeholder="e.g., 5.7 qt MAG 1 5W-30 + Mann Filter"
                    value={logForm.partsUsed}
                    onChange={(e) => setLogForm({ ...logForm, partsUsed: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>

                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">Torque Specs & Notes</label>
                  <textarea
                    rows="2"
                    placeholder="Notes..."
                    value={logForm.notes}
                    onChange={(e) => setLogForm({ ...logForm, notes: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>

                {!editingLogId && logForm.guideId && (
                  <label className="flex items-center gap-2 text-xs text-emerald-300 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={logForm.deductShelf}
                      onChange={(e) => setLogForm({ ...logForm, deductShelf: e.target.checked })}
                    />
                    Auto-deduct required parts/oil from Garage Shelf inventory
                  </label>
                )}

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setIsLogModalOpen(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950"
                  >
                    {editingLogId ? 'Save Changes' : 'Save Service Log'}
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL 2: ADD / EDIT VEHICLE */}
          {isVehicleModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 p-4 overflow-y-auto">
              <form
                onSubmit={handleSaveVehicle}
                className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 space-y-3"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">
                    {editingVehicleId ? 'Edit Vehicle Specs' : 'Add Vehicle to Garage'}
                  </h3>
                  <button type="button" onClick={() => setIsVehicleModalOpen(false)} className="text-slate-400">✕</button>
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <input
                    type="number"
                    required
                    placeholder="Year"
                    value={vehicleForm.year}
                    onChange={(e) => setVehicleForm({ ...vehicleForm, year: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />
                  <input
                    type="text"
                    required
                    placeholder="Make (e.g. Mazda)"
                    value={vehicleForm.make}
                    onChange={(e) => setVehicleForm({ ...vehicleForm, make: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />
                  <input
                    type="text"
                    required
                    placeholder="Model (e.g. Mazda3)"
                    value={vehicleForm.model}
                    onChange={(e) => setVehicleForm({ ...vehicleForm, model: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    placeholder="Trim / Engine"
                    value={vehicleForm.trim}
                    onChange={(e) => setVehicleForm({ ...vehicleForm, trim: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />
                  <input
                    type="number"
                    placeholder="Odometer"
                    value={vehicleForm.odometer}
                    onChange={(e) => setVehicleForm({ ...vehicleForm, odometer: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono"
                  />
                </div>

                <input
                  type="text"
                  placeholder="Engine Oil Spec & Capacity"
                  value={vehicleForm.oilSpec}
                  onChange={(e) => setVehicleForm({ ...vehicleForm, oilSpec: e.target.value })}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                />
                <input
                  type="text"
                  placeholder="Coolant Spec"
                  value={vehicleForm.coolantSpec}
                  onChange={(e) => setVehicleForm({ ...vehicleForm, coolantSpec: e.target.value })}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                />
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    placeholder="Spark Plug Spec & Torque"
                    value={vehicleForm.sparkPlugSpec}
                    onChange={(e) => setVehicleForm({ ...vehicleForm, sparkPlugSpec: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />
                  <input
                    type="text"
                    placeholder="Lug Nut Torque Spec"
                    value={vehicleForm.lugTorqueSpec}
                    onChange={(e) => setVehicleForm({ ...vehicleForm, lugTorqueSpec: e.target.value })}
                    className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>
                <textarea
                  rows="2"
                  placeholder="Notes, filter numbers, bulb sizes..."
                  value={vehicleForm.notes}
                  onChange={(e) => setVehicleForm({ ...vehicleForm, notes: e.target.value })}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                />

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setIsVehicleModalOpen(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950"
                  >
                    Save Vehicle
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL 3: ADD TOOL */}
          {isToolModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 p-4">
              <form
                onSubmit={handleSaveTool}
                className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 space-y-3"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">Add Tool to Garage Chest</h3>
                  <button type="button" onClick={() => setIsToolModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <input
                  type="text"
                  required
                  placeholder="Tool Name (e.g. 5/8 Magnetic Spark Plug Socket)"
                  value={toolForm.name}
                  onChange={(e) => setToolForm({ ...toolForm, name: e.target.value })}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                />
                <select
                  value={toolForm.category}
                  onChange={(e) => setToolForm({ ...toolForm, category: e.target.value })}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                >
                  {TOOL_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
                <label className="flex items-center gap-2 text-xs text-slate-300">
                  <input
                    type="checkbox"
                    checked={toolForm.owned}
                    onChange={(e) => setToolForm({ ...toolForm, owned: e.target.checked })}
                  />
                  I currently own this tool
                </label>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setIsToolModalOpen(false)} className="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300">Cancel</button>
                  <button type="submit" className="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950">Add Tool</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL 4: ADD SHELF ITEM */}
          {isShelfModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 p-4">
              <form
                onSubmit={handleSaveShelfItem}
                className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 space-y-3"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">Add Part / Fluid to Garage Shelf</h3>
                  <button type="button" onClick={() => setIsShelfModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <input
                  type="text"
                  required
                  placeholder="Item Name (e.g. MAG 1 5W-30 Full Synthetic)"
                  value={shelfForm.name}
                  onChange={(e) => setShelfForm({ ...shelfForm, name: e.target.value })}
