    const copyTextToClipboard = async (text) => {
      const str = String(text ?? '');
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(str);
          return true;
        }
      } catch (err) {}
      try {
        const textArea = document.createElement('textarea');
        textArea.value = str;
        textArea.setAttribute('readonly', '');
        textArea.style.position = 'fixed';
        textArea.style.top = '-9999px';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const copied = document.execCommand('copy');
        document.body.removeChild(textArea);
        return copied;
      } catch (fallbackErr) {
        return false;
      }
    };

    const SUPABASE_SETUP_SQL = `-- Run this once in your Supabase SQL Editor:
create table if not exists public.garage_state (
  sync_code text primary key,
  payload jsonb not null,
  updated_at timestamptz default now(),
  client_id text
);

alter table public.garage_state enable row level security;

drop policy if exists "Allow anon read/write by sync_code" on public.garage_state;
create policy "Allow anon read/write by sync_code"
  on public.garage_state
  for all
  to anon, authenticated
  using (true)
  with check (true);`;

    const normalizeSupabaseUrl = (rawInput) => {
      const trimmed = (rawInput || '').trim().replace(/\/+$/, '');
      if (!trimmed) return '';
      const dashMatch = trimmed.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
      if (dashMatch && dashMatch[1]) {
        return `https://${dashMatch[1].toLowerCase()}.supabase.co`;
      }
      if (/^[a-z0-9]{15,25}$/i.test(trimmed)) {
        return `https://${trimmed.toLowerCase()}.supabase.co`;
      }
      if (!/^https?:\/\//i.test(trimmed) && trimmed.includes('.supabase.co')) {
        return `https://${trimmed}`;
      }
      return trimmed;
    };

    const supabaseRestPull = async (url, anonKey, syncCode) => {
      const cleanUrl = normalizeSupabaseUrl(url);
      const cleanCode = encodeURIComponent(syncCode.trim().toUpperCase());
      const endpoint = `${cleanUrl}/rest/v1/garage_state?sync_code=eq.${cleanCode}&select=sync_code,payload,updated_at,client_id`;
      const res = await fetch(endpoint, {
        method: 'GET',
        headers: {
          apikey: anonKey.trim(),
          Authorization: `Bearer ${anonKey.trim()}`,
          'Content-Type': 'application/json'
        }
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`Supabase Pull HTTP ${res.status}: ${errText}`);
      }
      const rows = await res.json();
      return rows && rows.length > 0 ? rows[0] : null;
    };

    const supabaseRestPush = async (url, anonKey, syncCode, payloadObj, clientId) => {
      const cleanUrl = normalizeSupabaseUrl(url);
      const cleanCode = syncCode.trim().toUpperCase();
      const endpoint = `${cleanUrl}/rest/v1/garage_state?on_conflict=sync_code`;
      const body = {
        sync_code: cleanCode,
        payload: payloadObj,
        updated_at: new Date().toISOString(),
        client_id: clientId
      };
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: {
          apikey: anonKey.trim(),
          Authorization: `Bearer ${anonKey.trim()}`,
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates,return=representation'
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`Supabase Push HTTP ${res.status}: ${errText}`);
      }
      const rows = await res.json();
      return rows && rows.length > 0 ? rows[0] : body;
    };

    const compressImageFile = (file, maxWidth = 800, quality = 0.72) => {
      return new Promise((resolve) => {
        if (!file) {
          resolve(null);
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(event.target.result);
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

      'Sockets & Bits',

    const SERVICE_CATEGORIES = [
      'Maintenance',

    const SHELF_CATEGORIES = [
      'Fluids',
      'Filters',

    ];

    function App() {
      const savedLocalState = useMemo(() => {
        try {
          const raw = localStorage.getItem(LOCAL_STORAGE_STATE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }, []);

      const savedSupabaseCfg = useMemo(() => {
        try {
          const raw = localStorage.getItem(LOCAL_STORAGE_CONFIG_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }, []);

      const [vehicles, setVehicles] = useState(savedLocalState?.vehicles || INITIAL_VEHICLES);
      const [selectedVehicleId, setSelectedVehicleId] = useState(
        savedLocalState?.selectedVehicleId || INITIAL_VEHICLES[0].id
      );
      const [tools, setTools] = useState(savedLocalState?.tools || INITIAL_TOOLS);
      const [shelf, setShelf] = useState(savedLocalState?.shelf || INITIAL_SHELF);
      const [guides, setGuides] = useState(savedLocalState?.guides || INITIAL_GUIDES);
      const [logs, setLogs] = useState(savedLocalState?.logs || INITIAL_LOGS);

      const [supabaseUrl, setSupabaseUrl] = useState(
        savedSupabaseCfg?.supabaseUrl || DEFAULT_SUPABASE_URL
      );
      const [supabaseAnonKey, setSupabaseAnonKey] = useState(
        savedSupabaseCfg?.supabaseAnonKey || DEFAULT_SUPABASE_ANON_KEY
      );
      const [syncRoomCode, setSyncRoomCode] = useState(
        savedSupabaseCfg?.syncRoomCode || DEFAULT_GARAGE_SYNC_CODE
      );
      const [clientId] = useState(
        () => savedSupabaseCfg?.clientId || `dev-${Math.random().toString(36).slice(2, 10)}`
      );

      const isSupabaseConfigured = Boolean(supabaseUrl.trim() && supabaseAnonKey.trim());
      const [cloudStatus, setCloudStatus] = useState(
        isSupabaseConfigured ? 'connecting' : 'local-only'
      );
      const [cloudErrorMsg, setCloudErrorMsg] = useState('');
      const [lastSyncedAt, setLastSyncedAt] = useState(null);
      const [isPhoneModalOpen, setIsPhoneModalOpen] = useState(false);

      const isApplyingRemoteUpdate = React.useRef(false);
      const hasLoadedInitialCloud = React.useRef(false);
      const lastSyncedPayloadHash = React.useRef('');

      useEffect(() => {
        try {
          localStorage.setItem(
            LOCAL_STORAGE_STATE_KEY,
            JSON.stringify({
              vehicles,
              selectedVehicleId,
              tools,
              shelf,
              guides,
              logs,
              savedAt: new Date().toISOString()
            })
          );
        } catch (e) {}
      }, [vehicles, selectedVehicleId, tools, shelf, guides, logs]);

      useEffect(() => {
        try {
          localStorage.setItem(
            LOCAL_STORAGE_CONFIG_KEY,
            JSON.stringify({
              supabaseUrl,
              supabaseAnonKey,
              syncRoomCode,
              clientId
            })
          );
        } catch (e) {}
      }, [supabaseUrl, supabaseAnonKey, syncRoomCode, clientId]);

      const applyRemotePayload = React.useCallback((payload, timestampLabel) => {
        if (!payload || typeof payload !== 'object') return;
        const incomingHash = JSON.stringify(payload);
        if (incomingHash === lastSyncedPayloadHash.current) return;

        lastSyncedPayloadHash.current = incomingHash;
        isApplyingRemoteUpdate.current = true;

        if (Array.isArray(payload.vehicles) && payload.vehicles.length > 0) {
          setVehicles(payload.vehicles);
        }
        if (payload.selectedVehicleId) {
          setSelectedVehicleId(payload.selectedVehicleId);
        }
        if (Array.isArray(payload.tools)) setTools(payload.tools);
        if (Array.isArray(payload.shelf)) setShelf(payload.shelf);
        if (Array.isArray(payload.guides)) setGuides(payload.guides);
        if (Array.isArray(payload.logs)) setLogs(payload.logs);

        setCloudStatus('synced');
        setCloudErrorMsg('');
        setLastSyncedAt(
          timestampLabel
            ? new Date(timestampLabel).toLocaleTimeString()
            : new Date().toLocaleTimeString()
        );

        setTimeout(() => {
          isApplyingRemoteUpdate.current = false;
        }, 150);
      }, []);

      const handleManualPullFromSupabase = React.useCallback(
        async (silent = false) => {
          if (!supabaseUrl.trim() || !supabaseAnonKey.trim()) {
            setCloudStatus('local-only');
            return false;
          }
          const cleanRoom = (syncRoomCode || 'DEFAULT-GARAGE').trim().toUpperCase();
          setCloudStatus('syncing');
          try {
            const row = await supabaseRestPull(supabaseUrl, supabaseAnonKey, cleanRoom);
            if (row && row.payload) {
              applyRemotePayload(row.payload, row.updated_at);
              hasLoadedInitialCloud.current = true;
              if (!silent) showToast(`Pulled latest garage state (${cleanRoom})!`);
              return true;
            } else {
              const currentPayload = { vehicles, selectedVehicleId, tools, shelf, guides, logs };
              lastSyncedPayloadHash.current = JSON.stringify(currentPayload);
              await supabaseRestPush(supabaseUrl, supabaseAnonKey, cleanRoom, currentPayload, clientId);
              hasLoadedInitialCloud.current = true;
              setCloudStatus('synced');
              setCloudErrorMsg('');
              setLastSyncedAt(new Date().toLocaleTimeString());
              if (!silent) showToast(`Initialized Supabase room "${cleanRoom}"!`);
              return true;
            }
          } catch (err) {
            setCloudStatus('error');
            setCloudErrorMsg(err.message || 'Failed to connect to Supabase');
            return false;
          }
        },
        [supabaseUrl, supabaseAnonKey, syncRoomCode, vehicles, selectedVehicleId, tools, shelf, guides, logs, clientId, applyRemotePayload]
      );

      useEffect(() => {
        if (!supabaseUrl.trim() || !supabaseAnonKey.trim()) {
          setCloudStatus('local-only');
          setCloudErrorMsg('');
          hasLoadedInitialCloud.current = false;
          return;
        }
        let isMounted = true;
        const cleanRoom = (syncRoomCode || 'DEFAULT-GARAGE').trim().toUpperCase();
        handleManualPullFromSupabase(true);

        const checkRemoteChanges = async () => {
          if (!isMounted || isApplyingRemoteUpdate.current) return;
          try {
            const row = await supabaseRestPull(supabaseUrl, supabaseAnonKey, cleanRoom);
            if (row && row.payload && row.client_id !== clientId) {
              applyRemotePayload(row.payload, row.updated_at);
            }
          } catch (e) {}
        };

        const pollInterval = setInterval(checkRemoteChanges, 3500);
        return () => {
          isMounted = false;
          clearInterval(pollInterval);
        };
      }, [supabaseUrl, supabaseAnonKey, syncRoomCode, clientId, handleManualPullFromSupabase, applyRemotePayload]);

      useEffect(() => {
        if (
          !supabaseUrl.trim() ||
          !supabaseAnonKey.trim() ||
          !hasLoadedInitialCloud.current ||
          isApplyingRemoteUpdate.current
        ) {
          return;
        }
        const currentPayload = { vehicles, selectedVehicleId, tools, shelf, guides, logs };
        const payloadHash = JSON.stringify(currentPayload);
        if (payloadHash === lastSyncedPayloadHash.current) return;

        const cleanRoom = (syncRoomCode || 'DEFAULT-GARAGE').trim().toUpperCase();
        setCloudStatus('syncing');

        const debounceTimer = setTimeout(async () => {
          try {
            lastSyncedPayloadHash.current = payloadHash;
            await supabaseRestPush(supabaseUrl, supabaseAnonKey, cleanRoom, currentPayload, clientId);
            setCloudStatus('synced');
            setCloudErrorMsg('');
            setLastSyncedAt(new Date().toLocaleTimeString());
          } catch (err) {
            setCloudStatus('error');
            setCloudErrorMsg(err.message || 'Auto-sync error');
          }
        }, 400);

        return () => clearTimeout(debounceTimer);
      }, [vehicles, selectedVehicleId, tools, shelf, guides, logs, supabaseUrl, supabaseAnonKey, syncRoomCode, clientId]);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);
      const [logSearch, setLogSearch] = useState('');
      const [guideFilter, setGuideFilter] = useState('VEHICLE');
      const [toolSearch, setToolSearch] = useState('');
      const [isOdometerModalOpen, setIsOdometerModalOpen] = useState(false);
      const [tempOdometer, setTempOdometer] = useState('');
      const [isLogModalOpen, setIsLogModalOpen] = useState(false);
      const [editingLog, setEditingLog] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => {
          setToast((prev) => (prev?.message === message ? null : prev));
        }, 3500);
      };

      const activeVehicle = useMemo(
        () => vehicles.find((v) => v.id === selectedVehicleId) || vehicles[0] || null,
        [vehicles, selectedVehicleId]
      );

      const evaluateToolReadiness = useMemo(() => {
        const toolMap = new Map();
        tools.forEach((t) => toolMap.set(t.name.toLowerCase().trim(), t));
        return (requiredToolNames = []) => {
          const details = requiredToolNames.map((reqName) => {
            const match = toolMap.get(reqName.toLowerCase().trim());
            return {
              name: reqName,
              owned: match ? Boolean(match.owned) : false,
              loanerAvailable: match ? Boolean(match.loanerAvailable) : false,
              estBuyPrice: match ? Number(match.estBuyPrice || 20) : 20
            };
          });
          const missingCount = details.filter((d) => !d.owned).length;
          return {
            isReady: missingCount === 0,
            missingCount,
            totalCount: details.length,
            details
          };
        };
      }, [tools]);

      const handleToggleToolByName = (toolName) => {
        const existing = tools.find((t) => t.name.toLowerCase().trim() === toolName.toLowerCase().trim());
        if (existing) {
          const nextOwned = !existing.owned;
          setTools((prev) => prev.map((t) => (t.id === existing.id ? { ...t, owned: nextOwned } : t)));
          showToast(nextOwned ? `Marked "${existing.name}" as Owned!` : `Marked "${existing.name}" as Missing.`);
        }
      };

      const ownedToolsCount = tools.filter((t) => t.owned).length;
      const totalShelfItems = shelf.reduce((acc, s) => acc + (Number(s.quantity) > 0 ? 1 : 0), 0);

      const filteredLogs = useMemo(() => {
        return logs
          .filter((l) => (activeVehicle ? l.vehicleId === activeVehicle.id : true))
          .filter((l) => {
            if (!logSearch.trim()) return true;
            const q = logSearch.toLowerCase();
            return (
              l.serviceType.toLowerCase().includes(q) ||
              (l.partsUsed && l.partsUsed.toLowerCase().includes(q)) ||
              (l.notes && l.notes.toLowerCase().includes(q))
            );
          })
          .sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [logs, activeVehicle, logSearch]);

      return (
        <div className="min-h-screen pb-20 md:pb-10 bg-slate-950 text-slate-100 flex flex-col">
          {toast && (
            <div className="fixed bottom-20 md:bottom-5 right-4 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl bg-slate-900 border border-emerald-500/40 text-slate-100 shadow-2xl">
              <CheckCircle2 className="w-4 h-4 text-emerald-400" />
              <span className="text-xs font-medium">{toast.message}</span>
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 font-bold">
                  <Wrench className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="text-base font-bold text-white">
                    Garage<span className="text-emerald-400">Command</span> PRO
                  </h1>
                  <p className="text-[11px] text-slate-400 hidden sm:block">
                    Standalone Mobile & Desktop Edition
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <select
                  value={selectedVehicleId}
                  onChange={(e) => setSelectedVehicleId(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs font-semibold text-white"
                >
                  {vehicles.map((v) => (
                    <option key={v.id} value={v.id}>
                      {v.year} {v.make} {v.model} ({Number(v.odometer).toLocaleString()} mi)
                    </option>
                  ))}
                </select>

                <button
                  onClick={() => setIsPhoneModalOpen(true)}
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700"
                >
                  <Smartphone className="w-3.5 h-3.5" />
                  {cloudStatus === 'synced' ? 'Supabase Live' : 'Cloud Sync'}
                </button>
              </div>
            </div>

            {/* Desktop Nav */}
            <div className="max-w-7xl mx-auto px-4 pb-2 hidden md:flex items-center gap-2">
              {['dashboard', 'guides', 'shelf', 'tools', 'garage'].map((tab) => (
                <button
                  key={tab}
                  onClick={() => setActiveTab(tab)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold capitalize transition ${
                    activeTab === tab
                      ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  {tab === 'dashboard' ? 'Service Ledger' : tab}
                </button>
              ))}
            </div>
          </header>

          {/* Active Vehicle Banner */}
          {activeVehicle && (
            <div className="bg-slate-900/60 border-b border-slate-800 px-4 py-2.5">
              <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs">
                <div className="flex flex-wrap items-center gap-2">
                  <strong className="text-white text-sm">
                    {activeVehicle.year} {activeVehicle.make} {activeVehicle.model}
                  </strong>
                  <span className="px-2 py-0.5 rounded bg-slate-800 text-emerald-400">
                    Oil: {activeVehicle.oilSpec}
                  </span>
                  <span className="px-2 py-0.5 rounded bg-slate-800 text-purple-300">
                    Coolant: {activeVehicle.coolantSpec}
                  </span>
                </div>
                <div className="flex items-center gap-2 font-mono">
                  <span>Odometer: {Number(activeVehicle.odometer).toLocaleString()} mi</span>
                  <button
                    onClick={() => {
                      const next = prompt('Enter new odometer reading:', activeVehicle.odometer);
                      if (next && !isNaN(parseInt(next, 10))) {
                        setVehicles((prev) =>
                          prev.map((v) =>
                            v.id === activeVehicle.id ? { ...v, odometer: parseInt(next, 10) } : v
                          )
                        );
                      }
                    }}
                    className="text-emerald-400 underline"
                  >
                    Edit
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Main Content */}
          <main className="max-w-7xl w-full mx-auto px-4 py-5 space-y-5 flex-1">
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-bold text-white">Service & Expense Ledger</h2>
                  <input
                    type="text"
                    value={logSearch}
                    onChange={(e) => setLogSearch(e.target.value)}
                    placeholder="Search logs..."
                    className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white"
                  />
                </div>
                <div className="space-y-2.5">
                  {filteredLogs.map((log) => (
                    <div
                      key={log.id}
                      className="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-2"
                    >
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-sm text-white">{log.serviceType}</span>
                          <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400">
                            {log.performedBy}
                          </span>
                        </div>
                        <p className="text-xs text-slate-400 mt-0.5">
                          {log.date} • {Number(log.odometer).toLocaleString()} mi • {log.partsUsed}
                        </p>
                        {log.notes && <p className="text-xs text-slate-300 mt-1">{log.notes}</p>}
                      </div>
                      <div className="text-right font-mono font-bold text-emerald-400">
                        ${Number(log.cost).toFixed(2)}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'guides' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {guides
                  .filter((g) => !activeVehicle || g.vehicleId === activeVehicle.id || g.vehicleId === 'ALL')
                  .map((guide) => {
                    const readiness = evaluateToolReadiness(guide.requiredTools);
                    return (
                      <div
                        key={guide.id}
                        className="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3"
                      >
                        <div className="flex items-center justify-between">
                          <span
                            className={`text-xs font-bold px-2.5 py-0.5 rounded-full ${
                              readiness.isReady
                                ? 'bg-emerald-500/20 text-emerald-300'
                                : 'bg-amber-500/20 text-amber-300'
                            }`}
                          >
                            {readiness.isReady
                              ? 'READY TO DIY'
                              : `MISSING ${readiness.missingCount} TOOL(S)`}
                          </span>
                          <span className="text-xs text-slate-400">
                            Every {Number(guide.intervalMiles).toLocaleString()} mi
                          </span>
                        </div>
                        <h3 className="text-sm font-bold text-white">{guide.title}</h3>
                        <p className="text-xs text-slate-300 leading-relaxed">{guide.specsAndAdvice}</p>
                        <div className="flex flex-wrap gap-1.5 pt-1">
                          {readiness.details.map((t, i) => (
                            <button
                              key={i}
                              onClick={() => handleToggleToolByName(t.name)}
                              className={`px-2 py-1 rounded-lg text-[11px] font-medium border ${
                                t.owned
                                  ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
                                  : 'bg-rose-500/10 border-rose-500/40 text-rose-300'
                              }`}
                            >
                              {t.owned ? '✓ ' : '✗ '}
                              {t.name}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
              </div>
            )}

            {activeTab === 'shelf' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                {shelf.map((item) => (
                  <div
                    key={item.id}
                    className="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between"
                  >
                    <div>
                      <span className="text-[10px] uppercase text-cyan-400 font-bold">{item.category}</span>
                      <h4 className="text-sm font-bold text-white">{item.name}</h4>
                      <span className="text-xs text-slate-400 font-mono">{item.partNumber}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() =>
                          setShelf((prev) =>
                            prev.map((s) =>
                              s.id === item.id ? { ...s, quantity: Math.max(0, s.quantity - 1) } : s
                            )
                          )
                        }
                        className="p-1.5 rounded bg-slate-800 text-white"
                      >
                        -
                      </button>
                      <span className="font-mono font-bold text-base text-emerald-400">
                        {item.quantity}
                      </span>
                      <button
                        onClick={() =>
                          setShelf((prev) =>
                            prev.map((s) =>
                              s.id === item.id ? { ...s, quantity: s.quantity + 1 } : s
                            )
                          )
                        }
                        className="p-1.5 rounded bg-emerald-500/20 text-emerald-300"
                      >
                        +
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'tools' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                {tools.map((tool) => (
                  <div
                    key={tool.id}
                    onClick={() => handleToggleToolByName(tool.name)}
                    className={`p-3.5 rounded-2xl border cursor-pointer flex items-center justify-between ${
                      tool.owned
                        ? 'bg-slate-900 border-emerald-500/30'
                        : 'bg-slate-900/50 border-slate-800'
                    }`}
                  >
                    <div>
                      <span className="text-[10px] text-slate-400 block">{tool.category}</span>
                      <h4 className="text-xs font-bold text-white">{tool.name}</h4>
                    </div>
                    <span
                      className={`px-2 py-1 rounded text-[11px] font-bold ${
                        tool.owned ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'
                      }`}
                    >
                      {tool.owned ? 'Owned' : 'Missing'}
                    </span>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'garage' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {vehicles.map((v) => (
                  <div key={v.id} className="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-2">
                    <h3 className="text-base font-bold text-white">
                      {v.year} {v.make} {v.model} ({v.trim})
                    </h3>
                    <p className="text-xs text-slate-300">Oil: {v.oilSpec}</p>
                    <p className="text-xs text-slate-300">Coolant: {v.coolantSpec}</p>
                    <p className="text-xs text-slate-300">Spark Plugs: {v.sparkPlugSpec}</p>
                    <p className="text-xs text-slate-400">{v.notes}</p>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Supabase Setup Modal */}
          {isPhoneModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">Supabase Cloud Sync Setup</h3>
                  <button onClick={() => setIsPhoneModalOpen(false)} className="text-slate-400">
                    ✕
                  </button>
                </div>
                <input
                  type="text"
                  placeholder="Supabase Project URL or Reference ID"
                  value={supabaseUrl}
                  onChange={(e) => setSupabaseUrl(normalizeSupabaseUrl(e.target.value))}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono"
                />
                <input
                  type="password"
                  placeholder="Supabase Anon Public Key"
                  value={supabaseAnonKey}
                  onChange={(e) => setSupabaseAnonKey(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono"
                />
                <input
                  type="text"
                  placeholder="Garage Sync Code (e.g. JETTA-GARAGE-1)"
                  value={syncRoomCode}
                  onChange={(e) => setSyncRoomCode(e.target.value.toUpperCase())}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-mono font-bold"
                />
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => {
                      handleManualPullFromSupabase(false);
                      setIsPhoneModalOpen(false);
                    }}
                    className="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950"
                  >
                    Save & Sync
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Mobile Bottom Bar */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-800 flex justify-around py-2 z-40">
            {['dashboard', 'guides', 'tools', 'shelf', 'garage'].map((tab) => (
              <button
                key={tab}
                onClick={() => setActiveTab(tab)}
                className={`text-[11px] font-bold capitalize px-2 py-1 rounded ${
                  activeTab === tab ? 'text-emerald-400' : 'text-slate-400'
                }`}
              >
                {tab === 'dashboard' ? 'Ledger' : tab}
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
